version: 0.2

env:
  variables:
    NEXT_PUBLIC_API_URL: "https://api.your-domain.com"
  parameter-store:
    S3_BUCKET: "/rps/s3-bucket-name"
    CLOUDFRONT_DISTRIBUTION_ID: "/rps/cloudfront-distribution-id"

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm ci

  build:
    commands:
      - echo "Building the Next.js application..."
      - npm run build

  post_build:
    commands:
      - echo "Deploying to S3..."
      - aws s3 sync .next s3://${S3_BUCKET}/_next --delete
      - aws s3 sync public s3://${S3_BUCKET} --delete
      - aws cloudfront create-invalidation --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} --paths "/*"

artifacts:
  files:
    - .next/**/*
    - public/**/*
    - package.json
    - next.config.mjs
  base-directory: "."

cache:
  paths:
    - node_modules/**/*
    - .next/cache/**/*
